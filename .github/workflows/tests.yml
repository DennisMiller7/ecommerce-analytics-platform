name: Run tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres123
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce
        run: |
          python -m pytest tests